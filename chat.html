<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Box</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .tabs {
            display: flex;
            background-color: #f1f1f1;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .tab {
            margin-right: 10px;
            padding: 10px;
            cursor: pointer;
        }
        .chat-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .user-list {
            background-color: #f9f9f9;
            padding: 10px;
            border-right: 1px solid #ccc;
            white-space: nowrap;
        }
        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            border-bottom: 1px solid #ccc;
        }
        .chat-input {
            display: flex;
            border-top: 1px solid #ccc;
        }
        .chat-input input {
            flex: 1;
            padding: 10px;
            border: none;
            border-right: 1px solid #ccc;
        }
        .chat-input button {
            padding: 10px;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="tabs">
        <div class="tab">Room 1</div>
        <div class="tab">Room 2</div>
        <div class="tab">Room 3</div>
    </div>
    <div class="chat-container">
        <div class="user-list">
            <div>User 1</div>
            <div>User 2</div>
            <div>User 3</div>
        </div>
        <div class="chat-window">
            <div class="messages">
                <div>User 1: Hello!</div>
                <div>User 2: Hi there!</div>
            </div>
            <div class="chat-input">
                <input type="text" placeholder="Type a message...">
                <button>Send</button>
            </div>
        </div>
    </div>
</body>
</html>
